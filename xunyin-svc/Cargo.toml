[package]
name = "xunyin-svc"
version = "0.1.0"
description = "迅音输入法 —— 常驻服务进程（输入逻辑与界面将逐步搬到这里，改它不用重启宿主应用）"
edition = "2021"

[[bin]]
name = "xunyin-svc"
path = "src/main.rs"

[dependencies]
xunyin-rime = { path = "../xunyin-rime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
windows-core = "0.61"
