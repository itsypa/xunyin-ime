[package]
name = "lingxi-ime"
version = "0.1.0"
description = "灵犀输入法 —— 原生设置中心（Win32 + 公共控件，无 WebView 依赖）"
edition = "2021"

[[bin]]
name = "lingxi-ime"
path = "src/main.rs"

[dependencies]
lingxi-rime = { path = "../../lingxi-rime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
