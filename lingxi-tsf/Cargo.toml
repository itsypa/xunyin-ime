[package]
name = "lingxi-tsf"
version = "0.1.0"
description = "灵犀输入法 —— 系统级 TSF 文本服务 DLL"
edition = "2021"

[lib]
name = "lingxi_tsf"
crate-type = ["cdylib"]

[dependencies]
lingxi-rime = { path = "../lingxi-rime" }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"
