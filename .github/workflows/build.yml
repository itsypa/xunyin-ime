name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            lingxi-tsf
            lingxi-rime
            lingxi-ime/src-tauri
            installer

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lingxi-ime/package-lock.json

      - name: 安装前端依赖
        working-directory: lingxi-ime
        run: npm ci

      - name: 构建 lingxi-tsf（x64）
        working-directory: lingxi-tsf
        run: cargo build --release

      - name: 构建 lingxi-tsf（x86）
        working-directory: lingxi-tsf
        run: cargo build --release --target i686-pc-windows-msvc

      - name: 构建设置中心（前端 + 后端）
        working-directory: lingxi-ime
        run: |
          npm run build
          cd src-tauri
          cargo build --release --features custom-protocol

      - name: 注入构建版本号
        shell: powershell
        run: |
          $conf = "lingxi-ime/src-tauri/tauri.conf.json"
          $json = Get-Content $conf -Raw | ConvertFrom-Json
          $json.version = "0.1.$env:GITHUB_RUN_NUMBER"
          $text = $json | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $conf), $text, (New-Object System.Text.UTF8Encoding($false)))

      - name: 构建安装器（stub / 卸载器 / 打包器）
        working-directory: installer
        run: cargo build --release --features packer

      - name: 生成安装包（wind-installer）
        shell: powershell
        run: |
          .\tools\pack-installer.ps1 -SkipBuild -Version "0.1.$env:GITHUB_RUN_NUMBER" -Compression lzma

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: lingxi-ime-windows
          path: |
            build/installer-dist/*.exe
            lingxi-tsf/target/release/lingxi_tsf.dll
            lingxi-tsf/target/i686-pc-windows-msvc/release/lingxi_tsf.dll

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: LingxiIME v0.1.${{ github.run_number }}
          body: |
            Auto-built Windows installer (commit ${{ github.sha }})

            - Setup: installs the IME, registers both x64/x86 TSF views, includes an uninstaller
          files: |
            build/installer-dist/*.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
