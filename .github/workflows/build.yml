# 迅音输入法 · Windows 构建与发布
#
# ⚠️ 所有 run: 块必须是**纯 ASCII**。原因：GitHub 把 run 块写成**不带 BOM** 的临时 .ps1，
#    而 `shell: powershell` 跑的是 Windows PowerShell 5.1，它读取无 BOM 的脚本会按
#    **系统 ANSI 码页**解码 → 中文变乱码，乱码字节还可能吃掉字符串的结束引号，整段脚本
#    直接解析失败（实测报 "The string is missing the terminator"，属 ParserError）。
#    中文说明请写在 YAML 注释里（YAML 按 UTF-8 读，不受影响）；步骤名可以用中文。
#    仓库里的 tools/*.ps1 都是 UTF-8 **带 BOM**，所以脚本文件本身没有这个问题。
#
# 另外两条踩过的坑：
#   * secrets 不能出现在 step 级 if 表达式里（会在校验阶段判整份 workflow 无效）；
#   * PowerShell 数组 splat 只按位置传值，具名参数必须用哈希表 splat。

name: build-windows

# 两种触发方式，都不会"改一点代码就出一堆 run"：
#   * 手动：Actions 页面 → build-windows → Run workflow（或 gh workflow run）；
#   * 推版本标签：git tag v1.0.0 && git push origin v1.0.0 —— 版本号就用标签里的
#     1.0.0（发正式版走这条，别用自动序号）；手动触发则用 0.1.<构建序号>。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # secrets 提到 job 级 env：step 级 if 里不能用 secrets（见文件头说明）。
    env:
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            xunyin-tsf
            xunyin-rime
            xunyin-ime/native
            installer

      # 回归测试：TSF 按键/接口映射 + 配置解析（含旧配置兼容）。
      # xunyin-rime 的整体测试需要 librime 运行时数据，只跑纯配置用例。
      - name: 单元测试
        shell: powershell
        run: |
          cd xunyin-tsf
          cargo test
          if ($LASTEXITCODE -ne 0) { throw "xunyin-tsf tests failed" }
          cd ../xunyin-rime
          cargo test --lib -- config:: quick_input:: assoc:: blocklist::
          if ($LASTEXITCODE -ne 0) { throw "xunyin-rime config tests failed" }

      - name: 构建 xunyin-tsf（x64）
        working-directory: xunyin-tsf
        run: cargo build --release

      - name: 构建 xunyin-tsf（x86）
        working-directory: xunyin-tsf
        run: cargo build --release --target i686-pc-windows-msvc

      # 常驻服务：DLL 会从旁边拉起它；改服务代码不用重开宿主应用
      - name: 构建 xunyin-svc（x64）
        working-directory: xunyin-svc
        run: cargo build --release

      - name: 构建 xunyin-svc（x86）
        working-directory: xunyin-svc
        run: cargo build --release --target i686-pc-windows-msvc

      # 设置中心是原生 Win32 应用（无 WebView2 依赖）
      - name: 构建设置中心（原生）
        working-directory: xunyin-ime/native
        run: cargo build --release

      - name: 注入构建版本号
        shell: powershell
        run: |
          # NOTE: single quotes would keep $env: literal and write
          # 'version = "0.1.$env:GITHUB_RUN_NUMBER"' into Cargo.toml, which makes
          # cargo fail with a semver parse error. Use a double-quoted replacement.
          $conf = "xunyin-ime/native/Cargo.toml"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $ver = $env:GITHUB_REF_NAME -replace "^v", ""
          } else {
            $ver = "0.1.$env:GITHUB_RUN_NUMBER"
          }
          if ($ver -notmatch "^[0-9]+\.[0-9]+\.[0-9]+$") {
            throw "bad version from tag/run number: $ver"
          }
          $text = Get-Content $conf -Raw
          $text = $text -replace '(?m)^version = ".+"', "version = `"$ver`""
          if ($text -notmatch [regex]::Escape("version = `"$ver`"")) {
            throw "version injection failed: no version line in $conf"
          }
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $conf), $text, (New-Object System.Text.UTF8Encoding($false)))
          # NOTE: later steps (packing, portable zip name) reuse this same version
          # via the environment, so it is computed in exactly one place.
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "injected version $ver"
          cd xunyin-ime/native
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw "rebuild after version injection failed" }

      - name: 构建安装器（stub / 卸载器 / 打包器）
        working-directory: installer
        run: cargo build --release --features packer

      - name: 导入签名证书（配置了 secrets 才做）
        if: ${{ env.SIGN_PFX_BASE64 != '' }}
        shell: powershell
        run: |
          $bytes = [Convert]::FromBase64String($env:SIGN_PFX_BASE64)
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, $bytes)
          "SIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGN_PFX_PASSWORD=$env:SIGN_PFX_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 生成安装包（wind-installer）
        shell: powershell
        run: |
          # NOTE: named parameters need a **hashtable** splat. An array splat binds
          # positionally, so "-SkipBuild" would be passed as the value of -Arch and
          # the ValidateSet would reject it.
          $params = @{
            SkipBuild   = $true
            Arch        = "x64"
            Version     = "0.1.$env:GITHUB_RUN_NUMBER"
            Compression = "lzma"
          }
          if ($env:SIGN_PFX) {
            $params.Sign = $true
            $params.PfxPath = $env:SIGN_PFX
            $params.PfxPassword = $env:SIGN_PFX_PASSWORD
            Write-Host "code signing enabled"
          } else {
            Write-Host "no signing certificate (secrets.SIGN_PFX_BASE64), packing unsigned"
          }
          .\tools\pack-installer.ps1 @params
          if ($LASTEXITCODE -ne 0) { throw "pack-installer failed" }

      - name: 生成便携包（含 32 位注册脚本）
        shell: powershell
        run: |
          $stage = "build/portable"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "build/installer-payload/*" $stage -Recurse -Force
          Remove-Item "$stage/uninstall.exe" -Force -ErrorAction SilentlyContinue
          Copy-Item "tools/register-ime.ps1" $stage -Force
          Compress-Archive -Path "$stage/*" -DestinationPath "build/XunyinIME-$env:APP_VERSION-portable.zip" -Force

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: xunyin-ime-windows
          path: |
            build/installer-dist/*.exe
            build/*-portable.zip
            xunyin-tsf/target/release/xunyin_tsf.dll
            xunyin-tsf/target/i686-pc-windows-msvc/release/xunyin_tsf.dll

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 推标签触发时用标签本身（v1.0.0）；手动触发时退化为 v0.1.<构建序号>
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.1.{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && format('XunyinIME {0}', github.ref_name) || format('XunyinIME v0.1.{0}', github.run_number) }}
          body: |
            Auto-built Windows installer (commit ${{ github.sha }})

            - Setup x64: for 64-bit Windows
              （只发 x64 安装包；32 位 Windows 不支持。64 位系统里的 32 位程序照样能打字 ——
              安装包内的 tsf-x86 会一并装好）
            - Portable zip: unzip, then run `register-ime.ps1` as admin
          files: |
            build/installer-dist/*.exe
            build/*-portable.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
