name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            lingxi-tsf
            lingxi-rime
            lingxi-ime/src-tauri
            installer

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lingxi-ime/package-lock.json

      - name: 安装前端依赖
        working-directory: lingxi-ime
        run: npm ci

      - name: 构建 lingxi-tsf（x64）
        working-directory: lingxi-tsf
        run: cargo build --release

      - name: 构建 lingxi-tsf（x86）
        working-directory: lingxi-tsf
        run: cargo build --release --target i686-pc-windows-msvc

      - name: 构建设置中心（前端 + 后端）
        working-directory: lingxi-ime
        run: |
          npm run build
          cd src-tauri
          cargo build --release --features custom-protocol

      - name: 注入构建版本号
        shell: powershell
        run: |
          $conf = "lingxi-ime/src-tauri/tauri.conf.json"
          $json = Get-Content $conf -Raw | ConvertFrom-Json
          $json.version = "0.1.$env:GITHUB_RUN_NUMBER"
          $text = $json | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $conf), $text, (New-Object System.Text.UTF8Encoding($false)))

      - name: 构建安装器（stub / 卸载器 / 打包器）
        working-directory: installer
        run: cargo build --release --features packer

      - name: 导入签名证书（如已配置 secrets）
        if: ${{ secrets.SIGN_PFX_BASE64 != '' }}
        shell: powershell
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.SIGN_PFX_BASE64 }}")
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, $bytes)
          "SIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGN_PFX_PASSWORD=${{ secrets.SIGN_PFX_PASSWORD }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 生成安装包（wind-installer）
        shell: powershell
        run: |
          $params = @("-SkipBuild", "-Arch", "x64", "-Version", "0.1.$env:GITHUB_RUN_NUMBER", "-Compression", "lzma")
          if ($env:SIGN_PFX) {
            $params += @("-Sign", "-PfxPath", $env:SIGN_PFX, "-PfxPassword", $env:SIGN_PFX_PASSWORD)
            Write-Host "已启用代码签名"
          } else {
            Write-Host "未配置签名证书（secrets.SIGN_PFX_BASE64），跳过签名"
          }
          .\tools\pack-installer.ps1 @params

      - name: 生成便携包（含 32 位注册脚本）
        shell: powershell
        run: |
          $stage = "build/portable"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "build/installer-payload/*" $stage -Recurse -Force
          Remove-Item "$stage/uninstall.exe" -Force -ErrorAction SilentlyContinue
          Copy-Item "tools/register-ime.ps1" $stage -Force
          Compress-Archive -Path "$stage/*" -DestinationPath "build/LingxiIME-0.1.$env:GITHUB_RUN_NUMBER-portable.zip" -Force

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: lingxi-ime-windows
          path: |
            build/installer-dist/*.exe
            build/*-portable.zip
            lingxi-tsf/target/release/lingxi_tsf.dll
            lingxi-tsf/target/i686-pc-windows-msvc/release/lingxi_tsf.dll

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: LingxiIME v0.1.${{ github.run_number }}
          body: |
            Auto-built Windows installer (commit ${{ github.sha }})

            - Setup: installs the IME, registers both x64/x86 TSF views, includes an uninstaller
            - Portable zip: unzip, then run `register-ime.ps1` as admin (also for 32-bit Windows)
          files: |
            build/installer-dist/*.exe
            build/*-portable.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
