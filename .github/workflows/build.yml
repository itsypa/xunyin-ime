name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lingxi-ime/package-lock.json

      - name: 安装前端依赖
        working-directory: lingxi-ime
        run: npm ci

      - name: 构建 lingxi-tsf（x64）
        working-directory: lingxi-tsf
        run: cargo build --release

      - name: 构建 lingxi-tsf（x86）
        working-directory: lingxi-tsf
        run: cargo build --release --target i686-pc-windows-msvc

      - name: 复制 TSF DLL 到打包资源目录
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force lingxi-ime/src-tauri/tsf | Out-Null
          New-Item -ItemType Directory -Force lingxi-ime/src-tauri/tsf-x86 | Out-Null
          Copy-Item lingxi-tsf/target/release/lingxi_tsf.dll lingxi-ime/src-tauri/tsf/lingxi_tsf_x64.dll -Force
          Copy-Item lingxi-tsf/target/i686-pc-windows-msvc/release/lingxi_tsf.dll lingxi-ime/src-tauri/tsf-x86/lingxi_tsf_x86.dll -Force

      - name: 注入构建版本号
        shell: powershell
        run: |
          $conf = "lingxi-ime/src-tauri/tauri.conf.json"
          $json = Get-Content $conf -Raw | ConvertFrom-Json
          $json.version = "0.1.$env:GITHUB_RUN_NUMBER"
          $text = $json | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $conf), $text, (New-Object System.Text.UTF8Encoding($false)))

      - name: 构建 NSIS 安装包（设置中心 + TSF 注册）
        working-directory: lingxi-ime
        run: npm run tauri -- build -- --features custom-protocol

      - name: 安装包文件名改为英文
        shell: powershell
        run: |
          $nsis = "lingxi-ime/src-tauri/target/release/bundle/nsis"
          Get-ChildItem $nsis -Filter "*_x64-setup.exe" | ForEach-Object {
            $newName = "LingxiIME_0.1.$env:GITHUB_RUN_NUMBER_x64-setup.exe"
            Rename-Item -LiteralPath $_.FullName -NewName $newName -Force
            Write-Output "renamed to $newName"
          }

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: lingxi-ime-windows
          path: |
            lingxi-ime/src-tauri/target/release/bundle/nsis/*.exe
            lingxi-ime/src-tauri/target/release/lingxi-ime.exe
            lingxi-ime/src-tauri/tsf/lingxi_tsf_x64.dll
            lingxi-ime/src-tauri/tsf-x86/lingxi_tsf_x86.dll

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: LingxiIME v0.1.${{ github.run_number }}
          body: |
            Auto-built Windows installer (commit ${{ github.sha }})

            - NSIS setup (x64): registers both x64/x86 TSF views on install
            - lingxi-ime.exe: portable settings app
          files: |
            lingxi-ime/src-tauri/target/release/bundle/nsis/*.exe
            lingxi-ime/src-tauri/target/release/lingxi-ime.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
