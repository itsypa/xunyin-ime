# 迅音拼音 —— 面向办公与程序开发的增强拼音方案
# encoding: utf-8
# 在朙月拼音基础上：
#   * 挂载 xunyin_common 增强词库（办公/开发/emoji）
#   * 默认简体输出
#   * 支持英文混输（直接输入英文上屏）
---
schema:
  schema_id: xunyin_pinyin
  name: 迅音拼音
  version: "0.1"
  author:
    - 迅音输入法
  description: |
    面向办公与程序开发的增强拼音输入方案。
    内置办公常用词、开发术语、emoji 与符号速记。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, ABC ]
  - name: full_shape
    states: [ 半宽, 全宽 ]
  - name: ascii_punct
    states: [ 中文标点, 英文标点 ]
  - name: simplification
    reset: 1
    states: [ 繁体, 简体 ]
  - name: emoji
    states: [ 无, emoji ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - affix_segmentor@alphabet
    - affix_segmentor@pinyin
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - table_translator
    - table_translator@emoji
  filters:
    - simplifier
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - erase/^xx$/
    - abbrev/^([a-z]).+$/$1/
    - derive/^([jqxy])u$/$1v/
    - derive/^([aoe])$/$1o/
    - derive/un/uen/
    - derive/ue/ve/
    - derive/ui/uei/
    - derive/iou/iu/
    - derive/iu/iou/
    - abbrev/^([a-z]).+$/$1/
    - derive/[aeiou]$//
    - derive/[a-z]$//
    - derive/^([a-z]+)(\d)(\w+)$/$1$3/

translator:
  dictionary: xunyin_common
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([jqxy])v/$1u/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])ue/$1ue/
  comment_format:
    - xform/([nl])v/$1ü/
    - xform/([jqxy])v/$1u/

abc_segmentor:
  extra_tags:
    - code

alphabet: zyxwvutsrqponmlkjihgfedcba

recognizer:
  patterns:
    email: "^[a-z][-_.0-9a-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp:|mailto:).*$|^[a-z]+[.].+$"

key_binder:
  bindings:
    - { accept: Tab, send: Page_Down, when: has_menu }
    - { accept: Shift+Tab, send: Page_Up, when: has_menu }
    - { accept: minus, send: Page_Up, when: paging }
    - { accept: equal, send: Page_Down, when: has_menu }
    - { accept: bracketleft, send: Page_Up, when: has_menu }
    - { accept: bracketright, send: Page_Down, when: has_menu }

# Emoji 快捷输入（本地词库）
emoji:
  dictionary: emoji
  enable_user_dict: false
  enable_sentence: false
  enable_completion: false
  initial_quality: 0.4

# 方向键逐字符移动且到边界不循环（最左再按左不动，最右再按右不动）
navigator:
  bindings:
    KP_Left: left_by_char_no_loop
    KP_Right: right_by_char_no_loop

punctuator:
  full_shape:
    " ": { commit: "　" }
    ",": { commit: "，" }
    ".": { commit: "。" }
    "?": { commit: "？" }
    "!": { commit: "！" }
    ";": { commit: "；" }
    ":": { commit: "：" }
    "'": { pair: ["‘", "’"] }
    '"': { pair: ["“", "”"] }
    "(": { commit: "（" }
    ")": { commit: "）" }
    "[": { commit: "[" }
    "]": { commit: "]" }
    "{": { commit: "{" }
    "}": { commit: "}" }
    "<": [《, 〈, «]
    ">": [》, 〉, »]
    "/": { commit: "、" }
    "\\": { commit: "、" }
    "|": ["|", ｜, '§']
    "$": ["$", ￥, '€', '£']
    "^": ["^", ……]
    "~": ["~", ～, 〰]
    "@": ["@", ＠]
    "#": ["#", ＃]
    "&": ["&", ＆]
    "*": ["*", ＊, ・, ×, ※]
    "_": ["_", ——]
    "+": ["+", ＋]
    "=": ["=", ＝]
    "%": ["%", ％, '°']
    "`": ["`", ｀]
  half_shape:
    ",": { commit: "，" }
    ".": { commit: "。" }
    "?": { commit: "？" }
    "!": { commit: "！" }
    ";": { commit: "；" }
    ":": { commit: "：" }
    "'": { pair: ["‘", "’"] }
    '"': { pair: ["“", "”"] }
    "(": { commit: "（" }
    ")": { commit: "）" }
    "[": { commit: "[" }
    "]": { commit: "]" }
    "{": { commit: "{" }
    "}": { commit: "}" }
    "<": [《, 〈, «]
    ">": [》, 〉, »]
    "/": { commit: "、" }
    "\\": { commit: "、" }
    "|": ["|", ｜, '§']
    "$": ["$", ￥, '€', '£']
    "^": ["^", ……]
    "~": ["~", ～, 〰]
    "@": ["@", ＠]
    "#": ["#", ＃]
    "&": ["&", ＆]
    "*": ["*", ＊, ・, ×, ※]
    "_": ["_", ——]
    "+": ["+", ＋]
    "=": ["=", ＝]
    "%": ["%", ％, '°']
    "`": ["`", ｀]

simplifier:
  option_name: simplification
  opencc_config: t2s.json
