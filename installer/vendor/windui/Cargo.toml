[package]
edition = "2021"
name = "windui"
version = "0.16.1"
authors = ["huanfeng <huanfengf@gmail.com>"]
build = "build.rs"
exclude = [
    ".github/",
    ".remember/",
    "/scripts",
    "/temp",
    "/artifacts",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "轻量跨平台桌面 GUI：tiny-skia 渲染 + 平台原生窗口/文字（Windows: Win32+DirectWrite；macOS: Cocoa+CoreText）"
homepage = "https://github.com/huanfeng/wind-ui-rust"
documentation = "https://docs.rs/windui"
readme = "README.md"
keywords = [
    "gui",
    "ui",
    "desktop",
    "windows",
    "macos",
]
categories = [
    "gui",
    "rendering",
    "os::windows-apis",
    "os::macos-apis",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/huanfeng/wind-ui-rust"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[features]
d2d = []
default = [
    "svg",
    "d2d",
]
gpu = [
    "dep:wgpu",
    "dep:bytemuck",
    "dep:pollster",
    "dep:objc2-quartz-core",
]
svg = ["dep:resvg"]
svg-text = [
    "svg",
    "resvg/text",
    "resvg/system-fonts",
]

[lib]
name = "windui"
path = "src/lib.rs"

