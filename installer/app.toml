# ============================================================================
#  迅音输入法 安装清单（wind-installer / 清单驱动）
# ============================================================================
#  用法（见 tools/pack-installer.ps1）：
#    wind-packer build --config installer/app.toml --version <版本> \
#        --source-dir <payload 目录> --stub <wind-installer.exe>
#
#  [app]/[ui]/[theme]/[paths]/[strings]/[ime]/[[shortcut]]/[startup] 会嵌入归档，
#  安装/卸载器运行期读取；[package] 仅打包时使用。
#  能力段整段缺省 = 不执行该能力。
# ============================================================================

[app]
# id 同时是卸载时清理的用户数据目录名：本产品数据在 %APPDATA%\com.xunyin.ime，
# 故此处用与 Tauri 标识一致的取值（安装目录另由 [paths].install 指定）。
id              = "com.xunyin.ime"
display_name    = "迅音输入法"
version         = "0.1.0"                 # 构建时由 --version 覆盖
publisher       = "迅音输入法 项目"
description     = "基于 TSF 与 Rime 引擎的轻量中文输入法"
main_exe        = "xunyin-ime.exe"
setting_exe     = "xunyin-ime.exe"
start_menu_folder = "迅音输入法"
window_title    = "迅音输入法 安装向导"
url_protocol    = "xunyinime"
agreement_url   = ""
portable_marker = "portable_mode"
    # 安装/卸载前要先结束的进程：
    #   xunyin-ime  = 设置中心
    #   xunyin-svc  = 常驻服务（它随 DLL 被拉起，会在安装目录里一直被占用，
    #                 不停掉就换不掉 tsf\xunyin-svc.exe，卸载也删不干净）
process_names   = ["xunyin-ime", "xunyin-svc"]
    # 需要 ALL APPLICATION PACKAGES 读取权限的 DLL（沉浸式/UWP 应用加载输入法所需）
    # 路径一律用反斜杠：32 位 regsvr32（SysWOW64）无法处理混用正斜杠的路径（会把 / 当开关），
    # 实测 "tsf-x86/xunyin_tsf_x86.dll" 注册失败、换成反斜杠即成功。
acl_dlls        = ["tsf\\xunyin_tsf_x64.dll", "tsf-x86\\xunyin_tsf_x86.dll"]
legacy_files    = []
legacy_dirs     = []

[ui]
install_win   = { w = 520, h = 440 }
uninstall_win = { w = 480, h = 420 }

# 主题色：与状态栏主题蓝一致
[theme]
accent = "#4285F4"

# 默认路径模板：{id} 替换为 app.id，%VAR% 由向导展开
[paths]
install  = '%ProgramFiles%\XunyinIME'
portable = '%USERPROFILE%\XunyinIME'
data     = '%APPDATA%\com.xunyin.ime'

[strings]
data_dir_hint       = "用户词库、配置与日志路径"
mode_hint           = "标准安装将输入法注册到系统；便捷模式仅解压文件，不修改系统"
agreement_text      = "《用户服务协议》"
user_data_label     = "删除用户词库和配置数据"
cache_label         = "清除本地词库缓存"
delete_data_confirm = "将永久删除 {path} 下的所有词库和配置数据，卸载后无法恢复。\n\n确定要勾选删除吗？"

# ── TSF 输入法注册（COM + 语言档案）──────────────────────────────────────
# 与 xunyin-tsf/src/lib.rs 中的 CLSID / PROFILE GUID 必须一致。
[ime]
clsid        = "{7C4E9A38-2B61-4D5F-A8C3-9E7B5F1D2A64}"
# 必须与 xunyin-tsf/src/lib.rs 的 GUID_XUNYIN_PROFILE 一致：安装器写进用户输入法列表
# 的就是这个字符串，和 DLL 在 DllRegisterServer 里登记的档案对不上时，语言栏里
# 那条条目会指向一个不存在的档案 —— 用户切过去就是打不出字。
profile_guid = "{D5B8F2C7-4A93-4E18-B6D2-3C9F7A5E8B41}"
lang_id      = "0804"
dll_x64      = "tsf\\xunyin_tsf_x64.dll"
dll_x86      = "tsf-x86\\xunyin_tsf_x86.dll"
# 开发期多次 regsvr32 可能留下指向旧路径的悬空注册，安装前清扫同 GUID 的悬空项
sweep_residue = true
# 空 = 就地注册（DLL 留在安装目录）。系统目录布局要求 DLL 已代码签名，暂不启用。
system_subdir = ""

# ── 快捷方式 ─────────────────────────────────────────────────────────────
[[shortcut]]
target   = "xunyin-ime.exe"
name     = "迅音输入法 设置"
location = "start_menu"

[[shortcut]]
target   = "uninstall.exe"
name     = "卸载 迅音输入法"
location = "start_menu"

# ── 安装完成后启动设置中心 ───────────────────────────────────────────────
[startup]
prestart = true
exe      = "xunyin-ime.exe"

# ── 本机数据目录清理（卸载时）─────────────────────────────────────────────
# 设置中心的 WebView2 运行时把缓存写在 %LOCALAPPDATA%\com.xunyin.ime\EBWebView
# （实测约 57 MB）。它是可重建的缓存，卸载时随「清除本地词库缓存」一并删除；
# 用户词库与配置在 %APPDATA%\com.xunyin.ime，由「删除用户数据」控制，不在此列。
[localdata]
cache_dirs  = ["EBWebView"]
state_files = []
remove_dir_when_empty = true

# ── 打包参数（仅 wind-packer 使用）───────────────────────────────────────
[package]
compression = "lzma"
source_dir  = "../build/installer-payload"
output_name = "XunyinIME-Setup"
output_dir  = "../build/installer-dist"
logo        = "../xunyin-ime/icons/128x128.png"
icon        = "../xunyin-ime/icons/icon.ico"
